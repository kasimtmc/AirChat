# Coverage-guided fuzzing of the protocol's parsers with libFuzzer: `run.sh`, or cargo-fuzz on
# nightly; see README.md. The targets themselves live in `airchat_protocol::fuzz`.
[package]
name = "airchat-protocol-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
airchat-protocol = { path = "..", features = ["fuzzing"] }
libfuzzer-sys = "0.4"

# A workspace of its own: it builds with coverage instrumentation, the library's builds without.
[workspace]


[[bin]]
name = "chat_message"
path = "fuzz_targets/chat_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

