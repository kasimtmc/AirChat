# Coverage-guided fuzzing of the core's parsers (requirement S-11) with libFuzzer: `run.sh`, or
# cargo-fuzz on nightly; see README.md. The targets themselves live in `airchat_core::fuzz`.
[package]
name = "airchat-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
airchat-core = { path = "../airchat-core", features = ["fuzzing"] }
libfuzzer-sys = "0.4"

# A workspace of its own: it builds with coverage instrumentation, the core's builds without.
[workspace]

[[bin]]
name = "chat_message"
path = "fuzz_targets/chat_message.rs"
test = false
doc = false
bench = false

