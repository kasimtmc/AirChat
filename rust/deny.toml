# cargo-deny: what the Rust dependencies may be. Run `cargo deny check` here, and
# `cargo deny --manifest-path fuzz/Cargo.toml check` for the fuzz workspace (this file is found from there).
# docs/threat-model.md (A11) says why.

[advisories]
# RustSec advisories, unmaintained crates included, fail the check unless listed here with a reason.
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, unmaintained: a build-time macro of hax-lib, libcrux's verification annotations; none of it ships. Goes when libcrux moves off it." },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml, unmaintained: read at build time by askama's template macro, which UniFFI's binding generator uses; none of it ships. Goes when askama moves off it." },
]

[licenses]
# Everything that ships must be compatible with AirChat's GPL-3.0-or-later.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The two workspaces share this list, so a licence one of them lacks is no news.
unused-allowed-license = "allow"
exceptions = [
    # LLVM's libFuzzer, for `rust/fuzz` only; nothing of it ships. NCSA is GPL-compatible.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
# Two versions of one crate are worth knowing about, not failing on.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version; none of these crates is published.
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
